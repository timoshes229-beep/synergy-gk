<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synergy GK</title>
<link rel="icon" href="assets/logo.png">
<style>html{scroll-behavior:smooth}html,body{margin:0;padding:0;background:#0A0C0B}</style>
</head>
<body>
<section id="sgk-hero" class="sgk" aria-label="Synergy GK">

  <div class="sgk-bg"><div class="sgk-bg-move"><div class="sgk-bg-img"><div class="sgk-hs-wrap" data-sgk="hotspots"></div></div></div></div>
  <div class="sgk-overlay"></div>
  <div class="sgk-stripe"></div>
  <div class="sgk-net"></div>
  <div class="sgk-word"><div class="sgk-word-in" data-sgk="word"></div></div>
  <div class="sgk-spot"></div>

  <header class="sgk-top">
    <div class="sgk-r"><a class="sgk-logo" data-sgk="logo" href="#"></a></div>
    <div class="sgk-r sgk-insta-w">
      <a class="sgk-insta" data-sgk="insta" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span data-sgk="instaText"></span>
      </a>
    </div>
  </header>

  <div class="sgk-main">
    <div class="sgk-left">
      <div class="sgk-r"><div class="sgk-badge"><span class="sgk-dot"></span><span data-sgk="badge"></span></div></div>
      <h1 class="sgk-title" data-sgk="title"></h1>
      <p class="sgk-sub sgk-r" data-sgk="subtitle"></p>
      <div class="sgk-btns sgk-r">
        <a class="sgk-btn sgk-btn--main" data-sgk="btn1" href="#">
          <span class="sgk-btn-t" data-sgk="btn1Text"></span>
          <span class="sgk-btn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
        <a class="sgk-btn sgk-btn--ghost" data-sgk="btn2" href="#"><span class="sgk-btn-t" data-sgk="btn2Text"></span></a>
      </div>
      <div class="sgk-stats sgk-r" data-sgk="stats"></div>
    </div>

    <div class="sgk-right">
      <div class="sgk-card-wrap sgk-r">
        <div class="sgk-card-par">
          <div class="sgk-card-float">
            <div class="sgk-card">
              <div class="sgk-card-head">
                <span class="sgk-card-label" data-sgk="cardLabel"></span>
                <span class="sgk-card-tag" data-sgk="cardTag"></span>
              </div>
              <div class="sgk-card-name" data-sgk="cardName"></div>
              <div class="sgk-card-chips" data-sgk="cardChips"></div>
              <div class="sgk-bars" data-sgk="cardBars"></div>
              <div class="sgk-card-foot">
                <div class="sgk-price">
                  <span class="sgk-price-l" data-sgk="priceLabel"></span>
                  <span class="sgk-price-v" data-sgk="price"></span>
                </div>
                <a class="sgk-card-btn" data-sgk="cardBtn" href="#">
                  <span data-sgk="cardBtnText"></span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sgk-scroll-w sgk-r">
    <a class="sgk-scroll" data-sgk="scroll" href="#">
      <span class="sgk-mouse"><span></span></span>
      <span class="sgk-scroll-t" data-sgk="scrollText"></span>
    </a>
  </div>

  <div class="sgk-marquee"><div class="sgk-track" data-sgk="marquee"></div></div>
</section>

<style>
#sgk-hero{
  --sgk-top-offset:0px;
  --sgk-mq-speed:30s;
  --sgk-font-h:'Unbounded',Arial,sans-serif;
  --sgk-font-b:'Manrope',Arial,sans-serif;
  position:relative;width:100%;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  background:var(--sgk-bg,#0A0C0B);color:var(--sgk-text,#F4F6F1);
  font-family:var(--sgk-font-b);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
#sgk-hero.sgk-auto-h{min-height:0}
#sgk-hero *,#sgk-hero *::before,#sgk-hero *::after{box-sizing:border-box;margin:0;padding:0}
#sgk-hero a{text-decoration:none !important;-webkit-tap-highlight-color:transparent}
#sgk-hero svg{display:block}

/* ---------- ФОН ---------- */
#sgk-hero .sgk-bg,#sgk-hero .sgk-overlay,#sgk-hero .sgk-net,#sgk-hero .sgk-spot{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
#sgk-hero .sgk-bg{z-index:0;overflow:hidden;opacity:0;transition:opacity 1.6s ease}
#sgk-hero.sgk-loaded .sgk-bg{opacity:1}
#sgk-hero .sgk-bg-move{position:absolute;top:-3%;right:-3%;bottom:-3%;left:-3%;will-change:transform}
#sgk-hero .sgk-bg-img{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-image:var(--sgk-photo);background-size:cover;background-repeat:no-repeat;
  background-position:var(--sgk-photo-pos,center);
  transform:scale(1.04);animation:sgkKb 26s ease-in-out infinite alternate;will-change:transform;
}
#sgk-hero.sgk-nozoom .sgk-bg-img{animation:none}
#sgk-hero .sgk-overlay{
  z-index:1;
  background:
    linear-gradient(0deg,var(--sgk-bg) 0%,rgba(0,0,0,0) 34%),
    linear-gradient(100deg,var(--sgk-overlay) 0%,var(--sgk-overlay) 30%,var(--sgk-overlaySoft) 68%,rgba(0,0,0,0) 100%);
}
#sgk-hero .sgk-net{
  z-index:2;
  background-image:
    repeating-linear-gradient(45deg,var(--sgk-net) 0 1px,rgba(0,0,0,0) 1px 34px),
    repeating-linear-gradient(-45deg,var(--sgk-net) 0 1px,rgba(0,0,0,0) 1px 34px);
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 35%,#000 100%);
  mask-image:linear-gradient(90deg,rgba(0,0,0,0) 35%,#000 100%);
}
#sgk-hero.sgk-nonet .sgk-net{display:none}
#sgk-hero .sgk-spot{
  z-index:4;opacity:0;transition:opacity .6s ease;
  background:radial-gradient(520px circle at var(--sgk-mx,50%) var(--sgk-my,50%),var(--sgk-glow),rgba(0,0,0,0) 65%);
}
#sgk-hero.sgk-hover .sgk-spot{opacity:1}
#sgk-hero .sgk-word{
  position:absolute;left:0;right:0;bottom:64px;z-index:3;pointer-events:none;
  text-align:right;line-height:.8;overflow:hidden;
  opacity:0;transform:translateY(40px);transition:opacity 1.8s ease .4s,transform 1.8s cubic-bezier(.2,.8,.2,1) .4s;
}
#sgk-hero.sgk-play .sgk-word{opacity:1;transform:none}
#sgk-hero .sgk-word-in{
  display:inline-block;font-family:var(--sgk-font-h);font-weight:800;font-size:15vw;letter-spacing:-.03em;
  color:transparent;-webkit-text-stroke:1px var(--sgk-outlineWord);white-space:nowrap;will-change:transform;
}

/* ---------- ВЕРХНЯ ПАНЕЛЬ ---------- */
#sgk-hero .sgk-top{
  position:relative;z-index:5;width:100%;max-width:1320px;margin:0 auto;
  padding:calc(var(--sgk-top-offset) + 26px) clamp(16px,4vw,48px) 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#sgk-hero.sgk-notop .sgk-top{display:none}
#sgk-hero a.sgk-logo{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--sgk-font-h);font-weight:800;
  font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--sgk-text) !important;
}
#sgk-hero .sgk-logo-acc{color:var(--sgk-accent) !important}
#sgk-hero .sgk-logo-img{display:block;width:auto;max-width:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--sgk-logoRing);margin-right:8px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#sgk-hero a.sgk-logo:hover .sgk-logo-img{transform:rotate(-12deg) scale(1.06)}
#sgk-hero a.sgk-insta{
  display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 11px;border-radius:100px;
  border:1px solid var(--sgk-badgeBorder);background:var(--sgk-badgeBg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:14px;font-weight:600;color:var(--sgk-text) !important;
  transition:border-color .3s ease,color .3s ease,background .3s ease;
}
#sgk-hero a.sgk-insta svg{width:18px;height:18px;flex:none}
#sgk-hero a.sgk-insta:hover{border-color:var(--sgk-accent);color:var(--sgk-accent) !important}

/* ---------- ОСНОВНИЙ КОНТЕНТ ---------- */
#sgk-hero .sgk-main{
  position:relative;z-index:5;flex:1 1 auto;width:100%;max-width:1320px;margin:0 auto;
  padding:clamp(24px,4vh,48px) clamp(16px,4vw,48px) clamp(48px,8vh,96px);
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(24px,4vw,72px);align-items:center;
}
#sgk-hero.sgk-nocard .sgk-main{grid-template-columns:minmax(0,1fr)}
#sgk-hero.sgk-nocard .sgk-right{display:none}

#sgk-hero .sgk-badge{
  display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 13px;border-radius:100px;
  background:var(--sgk-badgeBg);border:1px solid var(--sgk-badgeBorder);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sgk-text);
}
#sgk-hero .sgk-dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--sgk-accent);flex:none}
#sgk-hero .sgk-dot::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:var(--sgk-accent);animation:sgkPing 1.8s ease-out infinite}

#sgk-hero .sgk-title{
  margin:24px 0 22px;font-family:var(--sgk-font-h);font-weight:800;
  font-size:clamp(34px,5.4vw,82px);line-height:1.04;letter-spacing:-.02em;color:var(--sgk-text);text-transform:none;
}
#sgk-hero .sgk-line{display:block;overflow:hidden;padding-bottom:.06em}
#sgk-hero .sgk-line--acc{padding-bottom:.24em}
#sgk-hero .sgk-line-in{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#sgk-hero.sgk-play .sgk-line-in{transform:none}
#sgk-hero .sgk-acc{position:relative;color:var(--sgk-accent)}
#sgk-hero .sgk-uline{position:absolute;left:0;bottom:-.16em;width:100%;height:.28em;overflow:visible;fill:none;stroke:var(--sgk-accent);stroke-width:5;stroke-linecap:round}
#sgk-hero .sgk-uline path{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.2s cubic-bezier(.6,.1,.2,1) 1.3s}
#sgk-hero.sgk-play .sgk-uline path{stroke-dashoffset:0}

#sgk-hero .sgk-sub{max-width:540px;font-size:clamp(15px,1.25vw,18px);line-height:1.6;font-weight:500;color:var(--sgk-textMuted)}

/* ---------- КНОПКИ ---------- */
#sgk-hero .sgk-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
#sgk-hero a.sgk-btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  height:58px;border-radius:100px;font-family:var(--sgk-font-b);font-size:15px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s ease,color .3s ease,border-color .3s ease,box-shadow .35s ease;
}
#sgk-hero a.sgk-btn:hover{transform:translateY(-3px)}
#sgk-hero a.sgk-btn:active{transform:translateY(0) scale(.98)}
#sgk-hero a.sgk-btn--main,
#sgk-hero a.sgk-btn--main:hover,
#sgk-hero a.sgk-btn--main:focus,
#sgk-hero a.sgk-btn--main .sgk-btn-t{color:var(--sgk-btnText) !important}
#sgk-hero a.sgk-btn--main{padding:0 9px 0 28px;background:var(--sgk-accent)}
#sgk-hero a.sgk-btn--main:hover{background:var(--sgk-accentHover);box-shadow:0 16px 40px var(--sgk-btnShadow)}
#sgk-hero a.sgk-btn--main::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
  transform:skewX(-20deg);animation:sgkShine 5s ease-in-out infinite 2.5s;
}
#sgk-hero .sgk-btn-ic{
  width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--sgk-btnIconBg);color:var(--sgk-btnIconColor) !important;
  transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
#sgk-hero .sgk-btn-ic svg{width:18px;height:18px}
#sgk-hero a.sgk-btn--main:hover .sgk-btn-ic{transform:rotate(-45deg)}
#sgk-hero a.sgk-btn--ghost,
#sgk-hero a.sgk-btn--ghost .sgk-btn-t{color:var(--sgk-ghostText) !important}
#sgk-hero a.sgk-btn--ghost{
  padding:0 28px;background:rgba(0,0,0,0);border:1.5px solid var(--sgk-ghostBorder);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
#sgk-hero a.sgk-btn--ghost:hover{background:var(--sgk-ghostHoverBg);border-color:var(--sgk-ghostHoverBg)}
#sgk-hero a.sgk-btn--ghost:hover,
#sgk-hero a.sgk-btn--ghost:hover .sgk-btn-t{color:var(--sgk-ghostHoverText) !important}

/* ---------- ЦИФРИ ---------- */
#sgk-hero .sgk-stats{display:flex;flex-wrap:wrap;gap:clamp(20px,3.4vw,52px);margin-top:44px;padding-top:28px;border-top:1px solid var(--sgk-badgeBorder);max-width:620px}
#sgk-hero .sgk-stat{min-width:0}
#sgk-hero .sgk-stat-num{font-family:var(--sgk-font-h);font-weight:700;font-size:clamp(22px,2.2vw,32px);line-height:1;color:var(--sgk-text);white-space:nowrap}
#sgk-hero .sgk-stat-suf{margin-left:4px;font-size:.62em;color:var(--sgk-accent)}
#sgk-hero .sgk-stat-l{margin-top:10px;max-width:150px;font-size:13px;line-height:1.4;color:var(--sgk-textMuted)}

/* ---------- КАРТКА МОДЕЛІ ---------- */
#sgk-hero .sgk-right{display:flex;justify-content:flex-end}
#sgk-hero .sgk-card-wrap{width:100%;max-width:400px}
#sgk-hero .sgk-r.sgk-card-wrap{transform:translateY(46px) scale(.96)}
#sgk-hero.sgk-play .sgk-r.sgk-card-wrap{transform:none}
#sgk-hero .sgk-card-par{perspective:900px;will-change:transform}
#sgk-hero .sgk-card-float{animation:sgkFloat 6s ease-in-out infinite}
#sgk-hero .sgk-card{
  position:relative;padding:26px;border-radius:24px;overflow:hidden;
  background:var(--sgk-cardBg);border:1px solid var(--sgk-cardBorder);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
#sgk-hero .sgk-card::before{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(380px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.12),rgba(255,255,255,0) 60%);
}
#sgk-hero .sgk-card:hover::before{opacity:1}
#sgk-hero .sgk-card > *{position:relative;z-index:1}
#sgk-hero .sgk-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
#sgk-hero .sgk-card-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sgk-textMuted)}
#sgk-hero .sgk-card-tag{padding:5px 11px;border-radius:100px;background:var(--sgk-accent);color:var(--sgk-btnText);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
#sgk-hero .sgk-card-tag:empty{display:none}
#sgk-hero .sgk-card-name{margin:18px 0 14px;font-family:var(--sgk-font-h);font-weight:700;font-size:24px;line-height:1.2;color:var(--sgk-text)}
#sgk-hero .sgk-card-chips{display:flex;flex-wrap:wrap;gap:8px}
#sgk-hero .sgk-chip{padding:6px 12px;border-radius:100px;border:1px solid var(--sgk-badgeBorder);font-size:12px;font-weight:600;color:var(--sgk-text);transition:border-color .3s ease,color .3s ease}
#sgk-hero .sgk-chip:hover{border-color:var(--sgk-accent);color:var(--sgk-accent)}
#sgk-hero .sgk-bars{display:flex;flex-direction:column;gap:14px;margin:24px 0}
#sgk-hero .sgk-bar-h{display:flex;justify-content:space-between;gap:10px;font-size:13px}
#sgk-hero .sgk-bar-l{color:var(--sgk-textMuted)}
#sgk-hero .sgk-bar-v{font-weight:700;color:var(--sgk-text)}
#sgk-hero .sgk-bar-t{margin-top:8px;height:6px;border-radius:6px;background:var(--sgk-barTrack);overflow:hidden}
#sgk-hero .sgk-bar-f{height:100%;width:0;border-radius:6px;background:var(--sgk-accent);transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
#sgk-hero.sgk-play .sgk-bar-f{width:var(--w)}
#sgk-hero .sgk-card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:20px;border-top:1px solid var(--sgk-badgeBorder)}
#sgk-hero .sgk-price{display:flex;flex-direction:column;gap:4px}
#sgk-hero .sgk-price-l{font-size:12px;color:var(--sgk-textMuted)}
#sgk-hero .sgk-price-v{font-family:var(--sgk-font-h);font-weight:700;font-size:22px;color:var(--sgk-text);white-space:nowrap}
#sgk-hero a.sgk-card-btn,
#sgk-hero a.sgk-card-btn span{color:var(--sgk-cardBtnText) !important}
#sgk-hero a.sgk-card-btn{
  display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:100px;
  background:var(--sgk-cardBtnBg);font-size:14px;font-weight:700;white-space:nowrap;
  transition:background .3s ease,transform .3s ease;
}
#sgk-hero a.sgk-card-btn svg{width:16px;height:16px;transition:transform .3s ease}
#sgk-hero a.sgk-card-btn:hover{background:var(--sgk-accent);transform:translateY(-2px)}
#sgk-hero a.sgk-card-btn:hover,
#sgk-hero a.sgk-card-btn:hover span{color:var(--sgk-btnText) !important}
#sgk-hero a.sgk-card-btn:hover svg{transform:translateX(3px)}

/* ---------- ПІДКАЗКА "ГОРТАЙ" ---------- */
#sgk-hero .sgk-scroll-w{position:absolute;right:clamp(16px,4vw,48px);bottom:112px;z-index:5}
#sgk-hero.sgk-noscroll .sgk-scroll-w{display:none}
#sgk-hero a.sgk-scroll{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--sgk-textMuted) !important}
#sgk-hero .sgk-mouse{position:relative;width:22px;height:34px;border:1.5px solid var(--sgk-ghostBorder);border-radius:12px}
#sgk-hero .sgk-mouse span{position:absolute;left:50%;top:6px;width:3px;height:7px;margin-left:-1.5px;border-radius:3px;background:var(--sgk-accent);animation:sgkScroll 1.8s ease-in-out infinite}
#sgk-hero .sgk-scroll-t{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}

/* ---------- БІГУЧИЙ РЯДОК ---------- */
#sgk-hero .sgk-marquee{
  position:relative;z-index:5;flex:none;width:110%;margin:0 0 22px -5%;padding:15px 0;overflow:hidden;
  background:var(--sgk-marqueeBg);transform:rotate(-1.4deg);box-shadow:0 10px 40px rgba(0,0,0,.25);
}
#sgk-hero.sgk-nomq .sgk-marquee{display:none}
#sgk-hero .sgk-track{display:flex;align-items:center;width:max-content;animation:sgkMq var(--sgk-mq-speed) linear infinite}
#sgk-hero .sgk-marquee:hover .sgk-track{animation-play-state:paused}
#sgk-hero .sgk-mq-i{padding:0 22px;font-family:var(--sgk-font-h);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--sgk-marqueeText)}
#sgk-hero .sgk-mq-s{width:8px;height:8px;flex:none;background:var(--sgk-marqueeText);transform:rotate(45deg)}

/* ---------- ПОЯВА ЕЛЕМЕНТІВ ---------- */
#sgk-hero .sgk-r{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
#sgk-hero.sgk-play .sgk-r{opacity:1;transform:none}
#sgk-hero.sgk-static .sgk-r,
#sgk-hero.sgk-static .sgk-line-in,

      logoRing:      "rgba(255,255,255,0.35)"   /* ЗМІНИТИ - тонке кільце навколо круглого логотипу */
    },

    /* ---------- ШРИФТИ (Google Fonts, з підтримкою кирилиці) ---------- */
    fonts: {
      url: "https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap", /* ЗМІНИТИ - посилання Google Fonts */
      heading: "Unbounded", /* ЗМІНИТИ - шрифт заголовків */
      body: "Manrope"       /* ЗМІНИТИ - шрифт тексту */
    },

    /* ---------- НАЛАШТУВАННЯ ---------- */
    settings: {
      fullScreen: true,      /* ЗМІНИТИ - true = блок на весь екран, false = висота по контенту */
      topOffset: 0,          /* ЗМІНИТИ - відступ зверху в px (якщо прозоре меню Tilda лежить поверх блоку, напр. 80) */
      animations: true,      /* ЗМІНИТИ - true = всі мікро-анімації, false = статичний блок */
      photoZoom: true,       /* ЗМІНИТИ - повільне "дихання" (наближення) фото */
      parallax: true,        /* ЗМІНИТИ - фон, слово і картка рухаються за мишкою (тільки ПК) */
      cursorGlow: true,      /* ЗМІНИТИ - світло за курсором (тільки ПК) */
      cardTilt: true,        /* ЗМІНИТИ - 3D-нахил картки при наведенні (тільки ПК) */
      accentUnderline: true, /* ЗМІНИТИ - намальоване підкреслення під акцентним рядком */
      showTopBar: true,      /* ЗМІНИТИ - показати логотип та Instagram зверху */
      showCard: true,        /* ЗМІНИТИ - показати картку моделі зі шкалами (на ПК - праворуч поверх фото, на телефоні - під текстом) */
      showNet: true,         /* ЗМІНИТИ - показати візерунок "сітка воріт" */
      showMarquee: true,     /* ЗМІНИТИ - показати бігучий рядок */
      showScrollHint: true,  /* ЗМІНИТИ - показати підказку "Гортай" (тільки в режимі "full") */
      marqueeSpeed: 32       /* ЗМІНИТИ - швидкість бігучого рядка в секундах (більше = повільніше) */
    }
  };
  /* ======================== КІНЕЦЬ CONFIG ======================== */


  var root = document.getElementById("sgk-hero");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  var S = CONFIG.settings;
  var mm = window.matchMedia ? function (q) { return window.matchMedia(q).matches; } : function () { return false; };
  var reduce = mm("(prefers-reduced-motion: reduce)");
  var fine = mm("(hover: hover) and (pointer: fine)");
  var animOn = S.animations && !reduce;

  /* --- шрифти --- */
  if (CONFIG.fonts.url && !document.querySelector("link[data-sgk-font]")) {
    var fl = document.createElement("link");
    fl.rel = "stylesheet"; fl.href = CONFIG.fonts.url; fl.setAttribute("data-sgk-font", "1");
    document.head.appendChild(fl);
  }
  root.style.setProperty("--sgk-font-h", "'" + CONFIG.fonts.heading + "', Arial, sans-serif");
  root.style.setProperty("--sgk-font-b", "'" + CONFIG.fonts.body + "', Arial, sans-serif");

  /* --- кольори --- */
  for (var key in CONFIG.colors) {
    if (Object.prototype.hasOwnProperty.call(CONFIG.colors, key)) root.style.setProperty("--sgk-" + key, CONFIG.colors[key]);
  }

  /* --- фото і налаштування --- */
  var P = CONFIG.photo;
  root.style.setProperty("--sgk-photo", 'url("' + P.desktop + '")');
  root.style.setProperty("--sgk-photo-m", 'url("' + (P.mobile || P.desktop) + '")');
  root.style.setProperty("--sgk-photo-pos", P.positionDesktop || "center");
  root.style.setProperty("--sgk-photo-pos-m", P.positionMobile || "center");
  root.style.setProperty("--sgk-top-offset", (S.topOffset || 0) + "px");
  root.style.setProperty("--sgk-mq-speed", (S.marqueeSpeed || 32) + "s");
  function flag(on, cls) { if (on) root.classList.add(cls); }
  flag(!S.fullScreen, "sgk-auto-h");
  flag(!S.photoZoom || !animOn, "sgk-nozoom");
  flag(!S.showTopBar, "sgk-notop");
  flag(!S.showCard, "sgk-nocard");
  flag(!S.showNet, "sgk-nonet");
  flag(!S.showMarquee, "sgk-nomq");
  flag(!S.showScrollHint, "sgk-noscroll");
  flag(P.mode === "panel", "sgk-panel");

  /* --- помічники --- */
  function q(n) { return root.querySelector('[data-sgk="' + n + '"]'); }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function txt(n, v) { var e = q(n); if (e) e.textContent = (v === undefined || v === null) ? "" : v; }
  function lnk(n, href, blank) {
    var e = q(n); if (!e) return;
    e.setAttribute("href", href || "#");
    if (blank) { e.setAttribute("target", "_blank"); e.setAttribute("rel", "noopener"); }
  }
  function isNum(v) { return /^\d+$/.test(String(v)); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

  /* --- логотип --- */
  var L = CONFIG.logo, logoEl = q("logo");
  lnk("logo", L.link);
  if (L.image) {
    var im = mk("img", "sgk-logo-img"); im.src = L.image; im.alt = L.text || "logo"; im.style.height = (L.imageHeight || 36) + "px";
    logoEl.appendChild(im);
  }
  if (!L.image || L.showText) {
    logoEl.appendChild(mk("span", "", L.text));
    if (L.accent) logoEl.appendChild(mk("span", "sgk-logo-acc", L.accent));
  }

  /* --- instagram --- */
  if (CONFIG.instagram.link) { lnk("insta", CONFIG.instagram.link, true); txt("instaText", CONFIG.instagram.text); }
  else { root.querySelector(".sgk-insta-w").style.display = "none"; }

  /* --- тексти --- */
  txt("badge", CONFIG.badge);
  txt("subtitle", CONFIG.subtitle);
  txt("word", CONFIG.bigWord);
  if (!CONFIG.bigWord) root.querySelector(".sgk-word").style.display = "none";

  var titleEl = q("title");
  CONFIG.title.forEach(function (line) {
    var l = mk("span", "sgk-line" + (line.accent ? " sgk-line--acc" : ""));
    var i = mk("span", "sgk-line-in" + (line.accent ? " sgk-acc" : ""), line.text);
    if (line.accent && S.accentUnderline) {
      i.insertAdjacentHTML("beforeend", '<svg class="sgk-uline" viewBox="0 0 300 24" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M4 17 C 70 6, 170 4, 296 12"/></svg>');
    }
    l.appendChild(i); titleEl.appendChild(l);
  });

  /* --- кнопки --- */
  txt("btn1Text", CONFIG.button1.text); lnk("btn1", CONFIG.button1.link, CONFIG.button1.newTab);
  txt("btn2Text", CONFIG.button2.text); lnk("btn2", CONFIG.button2.link, CONFIG.button2.newTab);
  if (!CONFIG.button2.text) q("btn2").style.display = "none";

  /* --- цифри --- */
  var statsEl = q("stats"), counters = [];
  CONFIG.stats.forEach(function (s) {
    var w = mk("div", "sgk-stat"), n = mk("div", "sgk-stat-num");
    var v = mk("span", "sgk-count", isNum(s.value) ? (animOn ? "0" : fmt(s.value)) : s.value);
    n.appendChild(v);
    if (s.suffix) n.appendChild(mk("span", "sgk-stat-suf", s.suffix));
    w.appendChild(n); w.appendChild(mk("div", "sgk-stat-l", s.label));
    statsEl.appendChild(w);
    if (isNum(s.value)) counters.push({ el: v, to: parseInt(s.value, 10) });
  });
  if (!CONFIG.stats.length) statsEl.style.display = "none";

  /* --- картка --- */
  var Cd = CONFIG.card;
  txt("cardLabel", Cd.label); txt("cardTag", Cd.tag); txt("cardName", Cd.name);
  txt("priceLabel", Cd.priceLabel); txt("price", Cd.price); txt("cardBtnText", Cd.buttonText);
  lnk("cardBtn", Cd.buttonLink, Cd.newTab);
  var chipsEl = q("cardChips");
  Cd.chips.forEach(function (c) { chipsEl.appendChild(mk("span", "sgk-chip", c)); });
  var barsEl = q("cardBars");
  Cd.bars.forEach(function (b, i) {
    var row = mk("div", "sgk-bar"), h = mk("div", "sgk-bar-h");
    h.appendChild(mk("span", "sgk-bar-l", b.label));
    h.appendChild(mk("span", "sgk-bar-v", b.text));
    var t = mk("div", "sgk-bar-t"), f = mk("div", "sgk-bar-f");
    f.style.setProperty("--w", Math.max(0, Math.min(100, b.value)) + "%");
    f.style.transitionDelay = (1.2 + i * 0.15) + "s";
    t.appendChild(f); row.appendChild(h); row.appendChild(t); barsEl.appendChild(row);
  });
  if (!Cd.bars.length) barsEl.style.display = "none";

  /* --- підказка прокрутки --- */
  txt("scrollText", CONFIG.scrollHint.text); lnk("scroll", CONFIG.scrollHint.link);

  /* --- бігучий рядок --- */
  var track = q("marquee");
  function mqGroup() {
    var g = document.createDocumentFragment();
    for (var r = 0; r < 3; r++) {
      CONFIG.marquee.forEach(function (it) { g.appendChild(mk("span", "sgk-mq-i", it)); g.appendChild(mk("span", "sgk-mq-s")); });
    }
    return g;
  }
  track.appendChild(mqGroup()); track.appendChild(mqGroup());
  if (!animOn) track.style.animation = "none";

  /* --- завантаження фото і позначки на ньому --- */
  var bgImgEl = root.querySelector(".sgk-bg-img"), hsWrap = q("hotspots"), dims = {}, lastMob = null;
  function isMob() { return window.innerWidth <= 900; }
  function srcFor(mob) { return (mob && P.mobile) ? P.mobile : P.desktop; }
  function parsePos(str) {
    var map = { left: 0, top: 0, center: 50, right: 100, bottom: 100 };
    var parts = String(str || "50% 50%").trim().split(/\s+/);
    function f(v) { return Object.prototype.hasOwnProperty.call(map, v) ? map[v] / 100 : parseFloat(v) / 100; }
    var x = f(parts[0]), y = parts.length > 1 ? f(parts[1]) : 0.5;
    return { x: isNaN(x) ? 0.5 : x, y: isNaN(y) ? 0.5 : y };
  }
  function placeHotspots() {
    var mob = isMob(), list = mob ? CONFIG.hotspotsMobile : CONFIG.hotspots, d = dims[srcFor(mob)];
    hsWrap.innerHTML = "";
    if (!list || !list.length || !d || !d.w) return;
    var W = bgImgEl.offsetWidth, H = bgImgEl.offsetHeight;
    var sc = Math.max(W / d.w, H / d.h), dw = d.w * sc, dh = d.h * sc;
    var pos = parsePos(mob ? P.positionMobile : P.positionDesktop);
    var ox = (W - dw) * pos.x, oy = (H - dh) * pos.y;
    list.forEach(function (h) {
      var a = mk("a", "sgk-hs" + (h.side === "right" ? " sgk-hs--r" : ""));
      a.setAttribute("href", h.link || "#");
      a.style.left = (ox + h.x * dw).toFixed(1) + "px";
      a.style.top = (oy + h.y * dh).toFixed(1) + "px";
      a.appendChild(mk("span", "sgk-hs-dot"));
      if (h.label) a.appendChild(mk("span", "sgk-hs-l", h.label));
      hsWrap.appendChild(a);
    });
  }
  function loadDims(src, cb) {
    if (dims[src]) { cb(); return; }
    var im = new Image();
    im.onload = function () { dims[src] = { w: im.naturalWidth, h: im.naturalHeight }; cb(); };
    im.onerror = function () { dims[src] = { w: 0, h: 0 }; cb(); };
    im.src = src;
  }
  function refreshPhoto() {
    var mob = isMob();
    loadDims(srcFor(mob), function () { root.classList.add("sgk-loaded"); placeHotspots(); });
    lastMob = mob;
  }
  refreshPhoto();
  setTimeout(function () { root.classList.add("sgk-loaded"); }, 2500);
  var rzT;
  window.addEventListener("resize", function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { if (isMob() !== lastMob) refreshPhoto(); else placeHotspots(); }, 150);
  });

  /* --- поява елементів по черзі --- */
  var rev = root.querySelectorAll(".sgk-r, .sgk-line-in");
  for (var r = 0; r < rev.length; r++) rev[r].style.transitionDelay = (0.15 + r * 0.09) + "s";

  function countUp(c) {
    var start = null, dur = 1600;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      c.el.textContent = fmt(Math.round(c.to * e));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function play() {
    if (root.classList.contains("sgk-play")) return;
    root.classList.add("sgk-play");
    setTimeout(function () { counters.forEach(countUp); }, 1100);
    setTimeout(function () { for (var k = 0; k < rev.length; k++) rev[k].style.transitionDelay = ""; }, 4000);
  }

  if (!animOn) {
    root.classList.add("sgk-static", "sgk-play");
  } else if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { requestAnimationFrame(function () { requestAnimationFrame(play); }); io.disconnect(); }
      });
    }, { threshold: 0.15 });
    io.observe(root);
  } else { play(); }

  /* --- паралакс і світло за курсором (тільки ПК з мишкою) --- */
  if (animOn && fine) {
    var bgMove = root.querySelector(".sgk-bg-move"), word = root.querySelector(".sgk-word-in"), cardPar = root.querySelector(".sgk-card-par");
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
    function tick() {
      cx += (tx - cx) * 0.07; cy += (ty - cy) * 0.07;
      if (S.parallax) {
        bgMove.style.transform = "translate3d(" + (-cx * 18).toFixed(2) + "px," + (-cy * 14).toFixed(2) + "px,0)";
        word.style.transform = "translate3d(" + (cx * 40).toFixed(2) + "px," + (cy * 16).toFixed(2) + "px,0)";
        cardPar.style.transform = "translate3d(" + (-cx * 16).toFixed(2) + "px," + (-cy * 12).toFixed(2) + "px,0)";
      }
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) raf = requestAnimationFrame(tick); else raf = null;
    }
    root.addEventListener("mousemove", function (e) {
      var b = root.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
      if (S.cursorGlow) { root.style.setProperty("--sgk-mx", x + "px"); root.style.setProperty("--sgk-my", y + "px"); }
      tx = x / b.width - 0.5; ty = y / b.height - 0.5;
      if (!raf) raf = requestAnimationFrame(tick);
    });
    root.addEventListener("mouseenter", function () { if (S.cursorGlow) root.classList.add("sgk-hover"); });
    root.addEventListener("mouseleave", function () { root.classList.remove("sgk-hover"); tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(tick); });

    /* 3D-нахил картки */
    if (S.cardTilt) {
      var card = root.querySelector(".sgk-card");
      card.addEventListener("mousemove", function (e) {
        var b = card.getBoundingClientRect(), px = (e.clientX - b.left) / b.width, py = (e.clientY - b.top) / b.height;
        card.style.transform = "rotateX(" + ((0.5 - py) * 10).toFixed(2) + "deg) rotateY(" + ((px - 0.5) * 12).toFixed(2) + "deg)";
        card.style.setProperty("--gx", (px * 100) + "%"); card.style.setProperty("--gy", (py * 100) + "%");
      });
      card.addEventListener("mouseleave", function () { card.style.transform = ""; });
    }
  }

})();
</script>

        el.style.transitionDelay = d + "s";
        el.classList.add("is-in");
        io.unobserve(el);
        setTimeout(function () { el.style.transitionDelay = ""; }, (d + 1.2) * 1000);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    each(els, function (e) { io.observe(e); });
  }

  var ICONS = {
    drop: '<path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/><path d="M9 14a3 3 0 0 0 3 3"/>',
    glove: '<path d="M7 21v-6l-2.5-4a1.4 1.4 0 0 1 2.3-1.6L8.5 12V5a1.5 1.5 0 0 1 3 0v6V4a1.5 1.5 0 0 1 3 0v7V5.5a1.5 1.5 0 0 1 3 0V11V8a1.5 1.5 0 0 1 3 0v6.5C20.5 18 18 21 15 21z"/><path d="M7 18h12"/>',
    shield: '<path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
    refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
    truck: '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
    ruler: '<path d="M4 15.5L15.5 4 20 8.5 8.5 20z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/>',
    star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
    water: '<path d="M3 15c2 0 2-1.5 4.5-1.5S9.5 15 12 15s2.5-1.5 4.5-1.5S19 15 21 15"/><path d="M3 19c2 0 2-1.5 4.5-1.5S9.5 19 12 19s2.5-1.5 4.5-1.5S19 19 21 19"/><path d="M12 3s3.5 3.8 3.5 6.3a3.5 3.5 0 0 1-7 0C8.5 6.8 12 3 12 3z"/>',
    wind: '<path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 15h15a3 3 0 1 1-3 3"/><path d="M3 12h7"/>',
    hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11V4a1.5 1.5 0 0 1 3 0v7V5.5a1.5 1.5 0 0 1 3 0V12v-3a1.5 1.5 0 0 1 3 0v6c0 3.5-2.5 6-6 6h-1.5c-2 0-3.3-.8-4.5-2.2L5 15.5c-1-1.2.5-2.8 1.8-1.8z"/>',
    bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    card: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/>',
    box: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.9" fill="currentColor" stroke="none"/>',
    telegram: '<path d="M21 4.5L3 11.3l5.6 2 2 6.2 3.3-3.6 4.9 3.6z"/><path d="M8.6 13.3L18 7l-7.4 8.5"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',
    pin: '<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'
  };
  function icon(name, sw) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.star) + '</svg>';
  }

  /* ===================== ЛОГІКА БЛОКУ ===================== */
  rich(q("kicker"), CONFIG.kicker);
  rich(q("title"), CONFIG.title);
  rich(q("lead"), CONFIG.lead);

  /* --- кошик: спільне сховище з блоком 12 --- */
  var KEY = S.cartKey || "sgk_cart_v1";
  function readCart() {
    try { var v = JSON.parse(window.localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return window.__sgkCartMem || []; }
  }
  function writeCart(c) {
    window.__sgkCartMem = c;
    try { window.localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
  }
  function addToCart(p, size) {
    var cart = readCart(), key = p.id + "|" + size, found = null;
    cart.forEach(function (it) { if (it.key === key) found = it; });
    if (found) found.qty += 1;
    else cart.push({ key: key, id: p.id, name: p.name, size: size, price: p.price, qty: 1, image: p.image || "" });
    writeCart(cart);
    var ev;
    try { ev = new CustomEvent("sgk:cart", { detail: { action: "add", open: !!S.openCartOnAdd } }); }
    catch (e) { ev = document.createEvent("CustomEvent"); ev.initCustomEvent("sgk:cart", false, false, { action: "add", open: !!S.openCartOnAdd }); }
    document.dispatchEvent(ev);
  }

  /* --- анімація "точка летить у кошик" --- */
  function fly(fromEl) {
    if (!animOn) return;
    var a = fromEl.getBoundingClientRect();
    var target = document.querySelector("#sgk-cart .sgk-cbtn");
    var tx = window.innerWidth - 56, ty = window.innerHeight - 56;
    if (target) { var b = target.getBoundingClientRect(); if (b.width) { tx = b.left + b.width / 2; ty = b.top + b.height / 2; } }
    var dot = mk("div", "sgk-fly");
    var sx = a.left + a.width / 2, sy = a.top + a.height / 2;
    dot.style.left = sx + "px"; dot.style.top = sy + "px";
    root.appendChild(dot);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        dot.style.transform = "translate(" + (tx - sx) + "px," + (ty - sy) + "px) scale(.6)";
        dot.style.opacity = "0.2";
      });
    });
    setTimeout(function () { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 850);
  }

  /* --- картки --- */
  var grid = q("grid"), cards = [];
  CONFIG.products.forEach(function (p, i) {
    var c = mk("article", "sgk-card sgk-rv");
    c.setAttribute("data-d", (0.05 + (i % 3) * 0.1).toFixed(2));
    var m = mk("div", "sgk-media");
    var i1 = media(p.image, p.name, CONFIG.photoLabel, "glove");
    if (p.image && p.imagePosition) i1.style.objectPosition = p.imagePosition;
    m.appendChild(i1);
    if (p.image && p.image2) { var i2 = media(p.image2, p.name); i2.className += " sgk-img2"; if (p.imagePosition) i2.style.objectPosition = p.imagePosition; m.appendChild(i2); }
    if (p.badge) m.appendChild(mk("span", "sgk-badge", p.badge));
    if (p.cut && CONFIG.cutNames[p.cut]) m.appendChild(mk("span", "sgk-cut", CONFIG.cutNames[p.cut]));
    c.appendChild(m);

    var b = mk("div", "sgk-body");
    b.appendChild(mk("h3", "sgk-name", p.name));
    if (p.desc) b.appendChild(mk("p", "sgk-desc", p.desc));

    if (p.ratings && p.ratings.length) {
      var bars = mk("div", "sgk-bars");
      p.ratings.forEach(function (r, k) {
        if (!CONFIG.ratingLabels[k]) return;
        var row = mk("div", "sgk-bar"), h = mk("div", "sgk-bar-h");
        h.appendChild(mk("span", "sgk-bar-l", CONFIG.ratingLabels[k]));
        h.appendChild(mk("span", "sgk-bar-v", String(r)));
        var t = mk("div", "sgk-bar-t"), f = mk("div", "sgk-bar-f");
        f.style.setProperty("--w", Math.max(0, Math.min(100, r * 10)) + "%");
        f.style.transitionDelay = (0.5 + k * 0.12) + "s";
        t.appendChild(f); row.appendChild(h); row.appendChild(t); bars.appendChild(row);
      });
      b.appendChild(bars);
    }

    var szh = mk("div", "sgk-sz-h");
    szh.appendChild(mk("span", "", CONFIG.sizeLabel));
    szh.appendChild(mk("span", "sgk-hint", CONFIG.needSizeText));
    b.appendChild(szh);
    var szs = mk("div", "sgk-szs");
    var chosen = { v: "" };
    (p.sizes || []).forEach(function (s) {
      var sb = mk("button", "sgk-sz", s);
      sb.type = "button";
      sb.setAttribute("data-size", s);
      sb.addEventListener("click", function () {
        each(szs.querySelectorAll(".sgk-sz"), function (x) { x.classList.remove("is-on"); });
        sb.classList.add("is-on"); chosen.v = s; c.classList.remove("is-need");
      });
      szs.appendChild(sb);
    });
    if (p.sizes && p.sizes.length === 1) { szs.firstChild.classList.add("is-on"); chosen.v = p.sizes[0]; }
    b.appendChild(szs);

    var foot = mk("div", "sgk-foot");
    var pr = mk("div", "sgk-price");
    pr.appendChild(mk("span", "sgk-pnow", fmt(p.price) + " " + CONFIG.currency));
    if (p.oldPrice) pr.appendChild(mk("span", "sgk-pold", fmt(p.oldPrice) + " " + CONFIG.currency));
    foot.appendChild(pr);
    var add = mk("button", "sgk-add");
    add.type = "button";
    var at = mk("span", "sgk-add-t", CONFIG.addText);
    var ai = mk("span", "sgk-add-ic"); ai.innerHTML = icon("bag", 2);
    add.appendChild(at); add.appendChild(ai);
    var tmr;
    add.addEventListener("click", function () {
      if (!chosen.v) {
        c.classList.remove("is-need"); void c.offsetWidth; c.classList.add("is-need");
        return;
      }
      addToCart(p, chosen.v);
      fly(add);
      add.classList.add("is-done"); at.textContent = CONFIG.addedText; ai.innerHTML = icon("check", 2.4);
      clearTimeout(tmr);
      tmr = setTimeout(function () { add.classList.remove("is-done"); at.textContent = CONFIG.addText; ai.innerHTML = icon("bag", 2); }, 1600);
    });
    foot.appendChild(add);
    b.appendChild(foot);
    c.appendChild(b);
    grid.appendChild(c);
    cards.push({ el: c, p: p, szs: szs, chosen: chosen });
  });

  /* --- фільтри --- */
  var state = { cat: "all", cut: "all" };
  function applyFilter() {
    var shown = 0;
    cards.forEach(function (o) {
      var ok = (state.cat === "all" || o.p.category === state.cat) && (state.cut === "all" || o.p.cut === state.cut);
      if (ok) {
        shown++;
        if (o.el.classList.contains("is-hid")) {
          o.el.classList.remove("is-hid");
          o.el.classList.add("is-in");
          if (animOn) { o.el.classList.remove("is-pop"); void o.el.offsetWidth; o.el.classList.add("is-pop"); }
        }
      } else o.el.classList.add("is-hid");
    });
    var em = q("empty"); em.textContent = CONFIG.emptyText; em.classList.toggle("is-on", shown === 0);
  }
  function chips(boxName, list, field) {
    var box = q(boxName);
    if (!list || !list.length) { box.style.display = "none"; return; }
    list.forEach(function (f, i) {
      var b = mk("button", "sgk-chip" + (i === 0 ? " is-on" : ""), f.name);
      b.type = "button";
      b.addEventListener("click", function () {
        each(box.querySelectorAll(".sgk-chip"), function (x) { x.classList.remove("is-on"); });
        b.classList.add("is-on"); state[field] = f.id; applyFilter();
      });
      box.appendChild(b);
    });
  }
  chips("fCat", CONFIG.categories, "cat");
  chips("fCut", CONFIG.cuts, "cut");

  /* --- розмір з калькулятора (блок 05) --- */
  document.addEventListener("sgk:size", function (e) {
    var s = e && e.detail ? String(e.detail.size) : "";
    if (!s) return;
    cards.forEach(function (o) {
      var btn = o.szs.querySelector('[data-size="' + s + '"]');
      if (!btn) return;
      each(o.szs.querySelectorAll(".sgk-sz"), function (x) { x.classList.remove("is-on"); });
      btn.classList.add("is-on"); o.chosen.v = s; o.el.classList.remove("is-need");
    });
  });

  reveal();

})();
</script>

  function stop() { clearInterval(timer); timer = null; tabs.forEach(function (t) { t.classList.remove("is-run"); }); }
  function start() {
    if (!auto || timer) return;
    tabs[cur].classList.add("is-run");

<script>
(function () {

  /* =================================================================
     CONFIG - ВЕСЬ КОНТЕНТ, ПОСИЛАННЯ, КОЛЬОРИ ТА НАЛАШТУВАННЯ
     Змінюйте лише значення в лапках / числа. Не видаляйте коми.
     ================================================================= */
  var CONFIG = {

    kicker: "Засновник",                                         /* ЗМІНИТИ - надпис над заголовком */
    title: "Я роками шукав [ідеальні] рукавиці. Тож зробив свої", /* ЗМІНИТИ - заголовок, [слово] = акцент */
    paragraphs: [                                                 /* ЗМІНИТИ - абзаци історії (чернетка - замініть на реальну історію) */
      "Synergy з'явився у воротах. Засновник бренду - діючий воротар, і кожна пара спочатку проходить перевірку в його руках: на тренуваннях, у дощ, у важких матчах.",
      "Ми не перепродуємо чужі бренди. Ми робимо рукавиці, в яких самі готові вийти на поле - і чесно розповідаємо, кому підходить кожна модель."
    ],
    quote: "Воротар не має права на помилку. Тому і рукавиці не мають права підвести.", /* ЗМІНИТИ - цитата засновника */
    name: "Ім'я Прізвище",                                        /* ЗМІНИТИ - ім'я засновника */
    role: "засновник Synergy, воротар",                           /* ЗМІНИТИ - хто він */

    photo: "https://timoshes229-beep.github.io/synergy-gk/assets/hero-mobile.jpg",                           /* ЗМІНИТИ - фото засновника ("" = заглушка) */
    photoPosition: "50% 18%",                                     /* ЗМІНИТИ - яку частину фото показувати "X% Y%" */
    photoLabel: "Фото засновника",                                /* ЗМІНИТИ - підпис на заглушці */
    number: "33",                                                 /* ЗМІНИТИ - велика цифра біля фото (ігровий номер). "" - прибрати */
    sealText: "SYNERGY - GOALKEEPER GLOVES - ",              /* ЗМІНИТИ - текст, що крутиться по колу (сам розтягується на все коло) */
    sealLogo: "https://timoshes229-beep.github.io/synergy-gk/assets/logo.png",                               /* ЗМІНИТИ - логотип у центрі кола. "" - сховати коло */

    facts: [                                                      /* ЗМІНИТИ - 3 факти (заглушки - уточніть у клієнта) */
      { value: "XX",  label: "років у воротах" },
      { value: "XXX", label: "матчів у рукавицях Synergy" },
      { value: "33",  label: "ігровий номер" }
    ],

    colors: {
      bg:              "#0A0C0B",                        /* ЗМІНИТИ - фон блоку */
      accent:          "#C8FF2E",                        /* ЗМІНИТИ - акцентний колір (кнопки, виділені слова, іконки) */
      accentHover:     "#B6F01A",                        /* ЗМІНИТИ - акцентний колір при наведенні */
      accentSoft:      "rgba(200,255,46,0.12)",          /* ЗМІНИТИ - м'який акцент (фон іконок, рамки при наведенні) */
      btnText:         "#0A0C0B",                        /* ЗМІНИТИ - текст на акцентних кнопках */
      btnShadow:       "rgba(200,255,46,0.35)",          /* ЗМІНИТИ - світіння акцентної кнопки при наведенні */
      text:            "#F4F6F1",                        /* ЗМІНИТИ - основний текст */
      textMuted:       "rgba(244,246,241,0.66)",         /* ЗМІНИТИ - другорядний текст */
      line:            "rgba(255,255,255,0.12)",         /* ЗМІНИТИ - лінії та рамки */
      cardBg:          "rgba(255,255,255,0.035)",        /* ЗМІНИТИ - фон карток */
      cardHover:       "rgba(255,255,255,0.06)",         /* ЗМІНИТИ - фон карток при наведенні */
      cardBorder:      "rgba(255,255,255,0.10)",         /* ЗМІНИТИ - рамка карток */
      ghostText:       "#F4F6F1",                        /* ЗМІНИТИ - текст прозорої кнопки */
      ghostBorder:     "rgba(244,246,241,0.35)",         /* ЗМІНИТИ - рамка прозорої кнопки */
      ghostHoverBg:    "#F4F6F1",                        /* ЗМІНИТИ - фон прозорої кнопки при наведенні */
      ghostHoverText:  "#0A0C0B",                        /* ЗМІНИТИ - текст прозорої кнопки при наведенні */
      phBg:            "#141816",                        /* ЗМІНИТИ - фон заглушки замість фото */
      phIcon:          "rgba(200,255,46,0.55)"           /* ЗМІНИТИ - іконка на заглушці */
    },

    fonts: {
      url: "https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap", /* ЗМІНИТИ - посилання Google Fonts */
      heading: "Unbounded", /* ЗМІНИТИ - шрифт заголовків */
      body: "Manrope"       /* ЗМІНИТИ - шрифт тексту */
    },

    settings: {
      animations: true      /* ЗМІНИТИ - true = мікро-анімації, false = статичний блок */
    }
  };
  /* ======================== КІНЕЦЬ CONFIG ======================== */

  /* ===================== СЛУЖБОВИЙ КОД (не змінювати) ===================== */
  var root = document.getElementById("sgk-story");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");
  var S = CONFIG.settings || {};
  function mq(x) { try { return window.matchMedia(x).matches; } catch (e) { return false; } }
  var reduce = mq("(prefers-reduced-motion: reduce)");
  var fine = mq("(hover: hover) and (pointer: fine)");
  var animOn = S.animations !== false && !reduce;

  if (CONFIG.fonts && CONFIG.fonts.url && !document.querySelector("link[data-sgk-font]")) {
    var fl = document.createElement("link");
    fl.rel = "stylesheet"; fl.href = CONFIG.fonts.url; fl.setAttribute("data-sgk-font", "1");
    document.head.appendChild(fl);
  }
  if (CONFIG.fonts) {
    root.style.setProperty("--sgk-font-h", "'" + CONFIG.fonts.heading + "', Arial, sans-serif");
    root.style.setProperty("--sgk-font-b", "'" + CONFIG.fonts.body + "', Arial, sans-serif");
  }
  for (var ck in CONFIG.colors) {
    if (Object.prototype.hasOwnProperty.call(CONFIG.colors, ck)) root.style.setProperty("--sgk-" + ck, CONFIG.colors[ck]);
  }

  function q(n) { return root.querySelector('[data-sgk="' + n + '"]'); }
  function each(list, fn) { Array.prototype.forEach.call(list || [], fn); }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function txt(n, v) { var e = q(n); if (e) e.textContent = (v === undefined || v === null) ? "" : v; return e; }
  function lnk(el, href, blank) {
    if (!el) return el;
    el.setAttribute("href", href || "#");
    if (blank) { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener"); }
    return el;
  }
  function esc(s) { return String(s === undefined || s === null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function rich(el, s) { if (el) el.innerHTML = esc(s).replace(/\[(.+?)\]/g, "<em>$1</em>"); return el; }
  function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  var PH_ICONS = {
    photo: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="12" width="38" height="28" rx="5"/><path d="M17 12l3-5h8l3 5"/><circle cx="24" cy="26" r="7"/></svg>',
    glove: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 44V31l-5-8c-1.3-2.2 1.6-4.4 3.4-2.6L17 24V9.5a2.5 2.5 0 0 1 5 0V22V7a2.5 2.5 0 0 1 5 0v15V8.5a2.5 2.5 0 0 1 5 0V22v-9a2.5 2.5 0 0 1 5 0v17.5C37 38 33 44 27 44z"/><path d="M15 38h22"/></svg>'
  };
  function placeholder(label, kind) {
    var d = mk("div", "sgk-ph");
    d.innerHTML = PH_ICONS[kind] || PH_ICONS.photo;
    if (label) d.appendChild(mk("span", "sgk-ph-l", label));
    return d;
  }
  function media(url, alt, label, kind) {
    if (url) { var i = mk("img", "sgk-img"); i.src = url; i.alt = alt || ""; i.loading = "lazy"; i.decoding = "async"; return i; }
    return placeholder(label, kind);
  }
  function reveal() {
    var els = root.querySelectorAll(".sgk-rv");
    if (!animOn) { root.classList.add("sgk-static"); return; }
    if (!("IntersectionObserver" in window)) { each(els, function (e) { e.classList.add("is-in"); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target, d = parseFloat(el.getAttribute("data-d") || "0");
        el.style.transitionDelay = d + "s";
        el.classList.add("is-in");
        io.unobserve(el);
        setTimeout(function () { el.style.transitionDelay = ""; }, (d + 1.2) * 1000);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    each(els, function (e) { io.observe(e); });
  }

  /* ===================== ЛОГІКА БЛОКУ ===================== */
  rich(q("kicker"), CONFIG.kicker);
  rich(q("title"), CONFIG.title);
  var ps = q("paras");
  CONFIG.paragraphs.forEach(function (t, i) { var p = mk("p", "sgk-rv", t); p.setAttribute("data-d", (0.16 + i * 0.08).toFixed(2)); ps.appendChild(p); });
  txt("quote", CONFIG.quote);
  txt("name", CONFIG.name);
  txt("role", CONFIG.role);
  txt("number", CONFIG.number);
  if (!CONFIG.number) q("number").style.display = "none";

  var ph = q("photo");
  ph.appendChild(media(CONFIG.photo, CONFIG.name, CONFIG.photoLabel, "photo"));
  ph.style.setProperty("--sgk-pos", CONFIG.photoPosition || "50% 20%");

  if (CONFIG.sealLogo) {
    q("sealText").textContent = CONFIG.sealText;
    q("sealText").setAttribute("textLength", "486");
    q("sealText").setAttribute("lengthAdjust", "spacing");
    var li = mk("img"); li.src = CONFIG.sealLogo; li.alt = "logo"; q("sealLogo").appendChild(li);
    if (!animOn) root.querySelector(".sgk-seal-ring").style.animation = "none";
  } else q("seal").style.display = "none";

  var fx = q("facts");
  CONFIG.facts.forEach(function (f, i) {
    var d = mk("div", "sgk-fact sgk-rv"); d.setAttribute("data-d", (0.35 + i * 0.08).toFixed(2));
    d.appendChild(mk("div", "sgk-fact-v", f.value));
    d.appendChild(mk("div", "sgk-fact-l", f.label));
    fx.appendChild(d);
  });
  if (!CONFIG.facts.length) fx.style.display = "none";

  reveal();

})();

<style>

#sgk-game .sgk-tile:first-child{grid-column:span 2;grid-row:span 2}
#sgk-game .sgk-tile .sgk-img,#sgk-game .sgk-tile .sgk-ph{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#sgk-game .sgk-tile:hover .sgk-img,#sgk-game .sgk-tile:hover .sgk-ph{transform:scale(1.07)}
#sgk-game .sgk-tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,0));opacity:0;transition:opacity .45s ease;pointer-events:none}
#sgk-game .sgk-tile:hover::after{opacity:1}
#sgk-game .sgk-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;font-size:14px;font-weight:700;color:#fff;opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease}
#sgk-game .sgk-tile:hover .sgk-cap{opacity:1;transform:none}
#sgk-game .sgk-rev-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:clamp(56px,7vw,96px);margin-bottom:22px}
#sgk-game .sgk-rev-title{font-family:var(--sgk-font-h);font-weight:700;font-size:clamp(20px,2vw,28px);color:var(--sgk-text)}
#sgk-game .sgk-arrows{display:flex;gap:10px}
#sgk-game .sgk-arr{width:50px;height:50px;border-radius:50%;border:1px solid var(--sgk-cardBorder) !important;display:flex;align-items:center;justify-content:center;color:var(--sgk-text);transition:background .25s ease,color .25s ease,transform .25s ease}
#sgk-game .sgk-arr svg{width:20px;height:20px}
#sgk-game .sgk-arr[data-sgk="prev"] svg{transform:rotate(180deg)}
#sgk-game .sgk-arr:hover{background:var(--sgk-accent);color:var(--sgk-btnText);transform:scale(1.06)}
#sgk-game .sgk-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px;cursor:grab}
#sgk-game .sgk-track::-webkit-scrollbar{display:none}
#sgk-game .sgk-track.is-drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
#sgk-game .sgk-rev{flex:0 0 calc((100% - 32px) / 3);scroll-snap-align:start;display:flex;flex-direction:column;padding:26px;border-radius:24px;background:var(--sgk-cardBg);border:1px solid var(--sgk-cardBorder);transition:border-color .35s ease,transform .35s ease;user-select:none}
#sgk-game .sgk-rev:hover{border-color:var(--sgk-accentSoft);transform:translateY(-4px)}
#sgk-game .sgk-stars{display:flex;gap:4px;color:var(--sgk-accent)}
#sgk-game .sgk-stars svg{width:18px;height:18px;fill:currentColor}
#sgk-game .sgk-rev-t{margin-top:16px;margin-bottom:22px;font-size:15px;line-height:1.65;color:var(--sgk-text)}
#sgk-game .sgk-who{display:flex;align-items:center;gap:12px;margin-top:auto}
#sgk-game .sgk-ava{position:relative;flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--sgk-accent);color:var(--sgk-btnText);font-family:var(--sgk-font-h);font-weight:800;font-size:16px}
#sgk-game .sgk-ava img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#sgk-game .sgk-nm{font-weight:800;font-size:15px;color:var(--sgk-text)}
#sgk-game .sgk-rl{font-size:13px;color:var(--sgk-textMuted)}
@media (max-width:1000px){
  #sgk-game .sgk-rev{flex-basis:calc((100% - 16px) / 2)}
}
@media (max-width:700px){
  #sgk-game .sgk-gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(140px,42vw,220px);gap:10px}
  #sgk-game .sgk-tile{border-radius:18px}
  #sgk-game .sgk-cap{opacity:1;transform:none;font-size:12.5px;left:12px;bottom:10px}
  #sgk-game .sgk-tile::after{opacity:1}
  #sgk-game .sgk-rev{flex-basis:86%}
  #sgk-game .sgk-track{margin:0 -16px;padding:0 16px 4px;width:calc(100% + 32px);scroll-padding:0 16px}
  #sgk-game .sgk-top .sgk-btn{width:100%}
}

#sgk-final .sgk-run{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none;overflow:hidden}
#sgk-final .sgk-run-in{display:inline-block;white-space:nowrap;font-family:var(--sgk-font-h);font-weight:800;font-size:clamp(90px,16vw,240px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--sgk-panelWord);animation:sgkRun 40s linear infinite}
#sgk-final .sgk-p-in{position:relative;z-index:1;max-width:820px}
#sgk-final .sgk-p-title{font-family:var(--sgk-font-h);font-weight:800;font-size:clamp(32px,5.4vw,78px);line-height:1.02;letter-spacing:-.02em;color:var(--sgk-panelText)}
#sgk-final .sgk-p-title em{font-style:normal;color:var(--sgk-panelText);background:linear-gradient(var(--sgk-panelText),var(--sgk-panelText)) 0 92%/0 6px no-repeat;transition:background-size 1s cubic-bezier(.6,.1,.2,1) .5s}
#sgk-final .sgk-panel.is-in .sgk-p-title em,#sgk-final.sgk-static .sgk-p-title em{background-size:100% 6px}
#sgk-final .sgk-p-text{margin-top:20px;max-width:560px;font-size:clamp(15px,1.3vw,18px);line-height:1.6;color:var(--sgk-panelText);opacity:.75}
#sgk-final .sgk-p-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
#sgk-final .sgk-pbtn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:58px;border-radius:100px;font-size:15px;font-weight:800;white-space:nowrap;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s ease,color .3s ease,box-shadow .3s ease}
#sgk-final .sgk-pbtn:hover{transform:translateY(-3px)}
#sgk-final .sgk-pbtn--dark,#sgk-final .sgk-pbtn--dark span{color:var(--sgk-panelBg) !important}
#sgk-final .sgk-pbtn--dark{padding:0 9px 0 28px;background:var(--sgk-panelText)}
#sgk-final .sgk-pbtn--dark:hover{box-shadow:0 16px 40px rgba(0,0,0,.25)}
#sgk-final .sgk-pbi{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sgk-panelBg);color:var(--sgk-panelText) !important;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#sgk-final .sgk-pbtn .sgk-pbi{color:var(--sgk-panelText) !important}
#sgk-final .sgk-pbi svg{width:18px;height:18px}
#sgk-final .sgk-pbtn--dark:hover .sgk-pbi{transform:rotate(-45deg)}
#sgk-final .sgk-pbtn--line,#sgk-final .sgk-pbtn--line span{color:var(--sgk-panelText) !important}
#sgk-final .sgk-pbtn--line{padding:0 26px;border:2px solid var(--sgk-panelText)}
#sgk-final .sgk-pbtn--line:hover{background:var(--sgk-panelText)}
#sgk-final .sgk-pbtn--line:hover,#sgk-final .sgk-pbtn--line:hover span{color:var(--sgk-panelBg) !important}
#sgk-final .sgk-pbi2{display:flex}
#sgk-final .sgk-pbi2 svg{width:20px;height:20px}

#sgk-final .sgk-foot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:32px;padding:clamp(56px,7vw,88px) 0 0}
#sgk-final a.sgk-logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--sgk-font-h);font-weight:800;font-size:18px;letter-spacing:.06em;color:var(--sgk-text) !important}
#sgk-final .sgk-logo img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}
#sgk-final .sgk-logo em{color:var(--sgk-accent)}
#sgk-final .sgk-f-tag{margin-top:16px;max-width:320px;font-size:14.5px;line-height:1.6;color:var(--sgk-textMuted)}
#sgk-final .sgk-soc{display:flex;gap:10px;margin-top:20px}
#sgk-final .sgk-soc a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--sgk-cardBorder);color:var(--sgk-text) !important;transition:background .3s ease,color .3s ease,transform .3s ease,border-color .3s ease}
#sgk-final .sgk-soc a svg{width:20px;height:20px}
#sgk-final .sgk-soc a:hover{background:var(--sgk-accent);border-color:var(--sgk-accent);color:var(--sgk-btnText) !important;transform:translateY(-3px)}
#sgk-final .sgk-f-h{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sgk-accent);margin-bottom:16px}
#sgk-final .sgk-f-col ul{list-style:none}
#sgk-final .sgk-f-col li + li{margin-top:10px}
#sgk-final .sgk-f-col a,#sgk-final .sgk-f-col li > span{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--sgk-text) !important;transition:color .25s ease,transform .25s ease}
#sgk-final .sgk-f-col a svg,#sgk-final .sgk-f-col li > span svg{width:17px;height:17px;color:var(--sgk-accent)}
#sgk-final .sgk-f-col a:hover{color:var(--sgk-accent) !important;transform:translateX(4px)}
#sgk-final .sgk-f-bottom{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:20px;padding:24px 0 28px;border-top:1px solid var(--sgk-line);font-size:13px;color:var(--sgk-textMuted)}
#sgk-final .sgk-f-bottom a{color:var(--sgk-textMuted) !important;transition:color .25s ease}
#sgk-final .sgk-f-bottom a:hover{color:var(--sgk-accent) !important}
#sgk-final .sgk-up{margin-left:auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sgk-accent);color:var(--sgk-btnText);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#sgk-final .sgk-up svg{width:20px;height:20px;transform:rotate(-90deg)}
#sgk-final .sgk-up:hover{transform:translateY(-4px)}
@keyframes sgkRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:900px){#sgk-final .sgk-foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#sgk-final .sgk-f-brand{grid-column:1/-1}}
@media (max-width:560px){
  #sgk-final .sgk-foot{grid-template-columns:minmax(0,1fr);gap:28px}
  #sgk-final .sgk-p-btns{flex-direction:column}
  #sgk-final .sgk-pbtn{width:100%}
  #sgk-final .sgk-pbtn--dark{justify-content:space-between}
  #sgk-final .sgk-wrap{padding-left:12px;padding-right:12px}
  #sgk-final .sgk-foot{padding-left:4px;padding-right:4px}
}

#sgk-cart .sgk-copy{font-size:13px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--sgk-accent);border-bottom:1px solid currentColor !important}
#sgk-cart .sgk-pre{margin-top:10px;max-height:240px;overflow:auto;padding:14px 16px;border-radius:14px;background:var(--sgk-inputBg);border:1px solid var(--sgk-inputBorder);font-family:var(--sgk-font-b);font-size:13px;line-height:1.6;color:var(--sgk-text);white-space:pre-wrap;word-break:break-word}

#sgk-cart .sgk-dr-f{padding:16px 24px 22px;border-top:1px solid var(--sgk-line);background:var(--sgk-drawerBg)}
#sgk-cart .sgk-sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px;color:var(--sgk-textMuted)}
#sgk-cart .sgk-sum b{font-family:var(--sgk-font-h);font-weight:800;font-size:24px;color:var(--sgk-text)}
#sgk-cart .sgk-note{margin-top:6px;font-size:12.5px;line-height:1.45;color:var(--sgk-textMuted)}
#sgk-cart .sgk-cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:58px;margin-top:14px;border-radius:100px;background:var(--sgk-accent);color:var(--sgk-btnText) !important;font-size:16px;font-weight:800;transition:background .3s ease,transform .3s ease,opacity .3s ease,box-shadow .3s ease}
#sgk-cart .sgk-cta span{color:var(--sgk-btnText) !important}
#sgk-cart .sgk-cta:hover{background:var(--sgk-accentHover);transform:translateY(-2px);box-shadow:0 12px 30px var(--sgk-btnShadow)}
#sgk-cart .sgk-cta[disabled]{opacity:.4;pointer-events:none}
#sgk-cart .sgk-cta.is-load span{opacity:.5}
#sgk-cart .sgk-back{display:block;margin:12px auto 0;font-size:14px;font-weight:700;color:var(--sgk-textMuted);transition:color .25s ease}
#sgk-cart .sgk-back:hover{color:var(--sgk-text)}
#sgk-cart .sgk-dr.is-done .sgk-sum,#sgk-cart .sgk-dr.is-done .sgk-note{display:none}

#sgk-cart .sgk-toast{position:fixed;left:50%;bottom:28px;z-index:99999;max-width:calc(100% - 32px);padding:13px 20px;border-radius:100px;background:var(--sgk-text);color:var(--sgk-bg);font-family:var(--sgk-font-b);font-size:14px;font-weight:700;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.4);
  transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,1.2,.4,1),opacity .3s ease}
#sgk-cart .sgk-toast.is-on{transform:translate(-50%,0);opacity:1}

@keyframes sgkBump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes sgkRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
@keyframes sgkIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes sgkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sgkDraw{to{stroke-dashoffset:0}}
@keyframes sgkShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (max-width:560px){
  #sgk-cart .sgk-dr{width:100%;border-left:0}
  #sgk-cart .sgk-dr-h{padding:18px 18px 14px}
  #sgk-cart .sgk-prog,#sgk-cart .sgk-pane{padding-left:18px;padding-right:18px}
  #sgk-cart .sgk-dr-f{padding:14px 18px 18px}
  #sgk-cart .sgk-cbtn{width:58px;height:58px}
